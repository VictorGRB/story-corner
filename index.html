        <h1>📚 Story Corner</h1>

        <form id="book-form">
            <div class="input-wrapper">
                <input id="title" type="text" placeholder="Book Title" required />
                <button type="button" id="clear-input" class="clear-btn" style="display: none;">&#10005;</button>
                <div id="loading-spinner" style="display: none;">Loading...</div>
            </div>
            <div id="suggestions-spinner" class="spinner" style="display: none;">
                <div class="loader"></div>
            </div>
            <ul id="suggestions-list" class="suggestions"></ul>
            <button id="load-more" style="display: none;">Load More</button>
        </form>

        <div id="book-list"></div>

        <div id="confirmationModal" class="modal">
            <div class="modal-content">
                <h3>Are you sure you want to delete this book?</h3>
                <button id="confirmDelete" class="confirm-btn">Yes, delete</button>
                <button id="cancelDelete" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>
